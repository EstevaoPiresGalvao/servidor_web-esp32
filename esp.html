<!DOCTYPE html>
<html lang="pt-br">

                <head>
<meta charset="UTF-8">
<meta http-equiv='refresh' content='11'>
<title> Servidor Web </title>


<style>
body{
    background-color: darkblue;
    text-align: center;
    
#alinhar{
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    margin: 30px;
    }
    
    .titulo{
        background: lightgray;
        border: 4px solid white;
        font-size: 340%;
        font-color: white;
        }
    
    #elemento{
        font-size: 240%;
        font-color: black;
        }

    .quadro{
        width: fit-content;
        padding: 6px;
        margin: auto;
        border: 2px solid black;
        background: lightgray;
        }
    
    #valor{
        font-size: 140%;
        font-color: darkblue;
        }
    
    .gas{
        width: fit-content;
        border: 8px solid green;
        background: lightgreen;
        padding: 25px;
        }

    .temperatura{
        width: fit-content;
        border: 8px solid green;
        background: lightgreen;
        padding: 25px;
        }

    .led{
        width: fit-content;
        border: 8px solid green;
        background: lightgreen;
        padding: 25px;
        }

}
</style>
                </head>


<body>
<h1 class="titulo">Servidor Climático DSM</h1>
<br>
    <div id="alinhar">
  <script>
    function sensor_gas() {
    fetch('/gas')
    .then(response=>response.text())
    .then(dados => {
        document.getElementById('valor_gas').innerText = dados;
    })
.catch(err => console.error('Erro ao buscar gases:', err));
}
setInterval(sensor_gas, 10000);
  </script>
<div class="gas">
<h1 id="elemento">Presença de Gás:</h1>
<p id="valor" class="quadro">add valor aqui</p>
</div>

  <script>
  function temperatura() {
    fetch('/temp')
    .then(response=>response.text())
    .then(dados => {
        document.getElementById('valor_temperatura').innerText = dados;
    })
.catch(err => console.error('Erro ao buscar temperatura:', err));
}
setInterval(sensor_gas, 10000);
  </script>
<div class="temperatura">
<h1 id="elemento">Temperatura:</h1>
<p id="valor" class="quadro">add valor aqui</p>
</div>

  <script>
  function led() {
    fetch('/luz')
    .then(response=>response.text())
    .then(dados => {
        document.getElementById('estado-led').innerText = dados;
    })
.catch(err => console.error('Erro ao ligar luz:', err));
}
setInterval(sensor_gas, 10000);
  </script>
<div class="led">
<h1 id="elemento">Estado do Led:</h1>
<p id="valor" class="quadro">add valor aqui</p>
</div>
        </div>
                </body>


                </html>
